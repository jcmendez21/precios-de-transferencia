[project]
name = "pt-docs"
version = "0.1.0"
description = "Sistema de generación de documentación de precios de transferencia (DIAN Colombia)"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.0,<5.2",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "django-allauth>=0.61",
    "django-simple-history>=3.5",
    "django-q2>=1.6",
    "redis>=5.0",
    "gunicorn>=21.2",
    "whitenoise>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "pre-commit>=3.7",
]

[tool.setuptools]
packages = ["config", "apps"]
package-dir = {"" = "src"}
