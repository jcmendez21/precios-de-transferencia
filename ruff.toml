line-length = 100
target-version = "py312"

[lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "DJ",      # flake8-django
    "SIM",     # simplify
    "RUF",     # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[lint.per-file-ignores]
"tests/*" = ["N802", "N803"]  # tests pueden usar nombres largos
"**/migrations/*" = ["ALL"]
